name: Scripbox
description: >-
  Scripbox is an Indian direct-to-consumer wealth management and mutual fund
  investment platform operated by Scripbox Wealth Managers Private Limited. It
  helps families pursue financial freedom through personalized mutual fund
  recommendations shaped by expert advisors and data-backed algorithms, offering
  both regular (commission-based, zero monthly fee) and direct (advisory-fee)
  plans. The platform bundles portfolio construction and monitoring, financial
  planning, goal-based investing, tax-saving tools such as its Smart Withdraw
  algorithm, and multi-channel support. As of this enrichment pass, Scripbox
  operates purely as a consumer application and publishes no public developer
  API, developer portal, SDKs, or machine-readable API specifications.
